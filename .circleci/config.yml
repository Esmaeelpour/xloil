# OPTIONAL, INACTIVE fallback CI. It isn't needed while this repository is public:
# GitHub Actions minutes are unlimited for public repos. Use it only if the repo
# becomes private and runs out of Actions minutes. Runs the same build as
# .github/workflows/build-release.yml: stub-mode Python tests on Linux, the
# Windows x64 add-in build, wheels, and (on a v* tag) a GitHub Release.
#
# Setup: connect the repository at https://app.circleci.com, then add an
# environment variable GITHUB_TOKEN (a token with `repo` scope) to the project
# so the release job can publish.

version: 2.1

orbs:
  win: circleci/windows@5.0

parameters:
  package-version:
    type: string
    default: "0.22.1.post1"

jobs:
  python-tests:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run: pip install numpy tomlkit pandas polars matplotlib pytest setuptools wheel
      - run:
          name: Stub-mode unit tests
          working_directory: libs/xlOil_Python/Package
          command: XLOIL_STUBS=1 python -m pytest tests -v
      - run: python tools/build_stubs_wheel.py --version << pipeline.parameters.package-version >>
      - persist_to_workspace:
          root: build
          paths: [dist]

  build-windows:
    executor:
      name: win/server-2022
      size: large
      shell: powershell.exe -ExecutionPolicy Bypass
    steps:
      - checkout
      - run: git submodule update --init --recursive
      - run:
          name: Download sqlite amalgamation
          command: |
            Invoke-WebRequest -Uri https://www.sqlite.org/2022/sqlite-amalgamation-3390300.zip -OutFile external\sqlite.zip
            Expand-Archive external\sqlite.zip -DestinationPath external
            Rename-Item -Path (Get-ChildItem -Directory external\sqlite-amalgamation*) -NewName "sqlite"
      - run:
          name: Extract bundled Python headers and libs
          command: |
            choco install 7zip --no-progress -y
            & "C:\Program Files\7-Zip\7z.exe" x external\python.7z -oexternal -y
      - run:
          name: Install Office for the Excel type libraries
          command: choco install office365business --no-progress -y
          no_output_timeout: 45m
      - run:
          name: Install Python versions
          command: |
            choco install python39 python310 python311 python312 python313 python314 --no-progress -y
      - run:
          name: Build solution (Release x64)
          command: |
            ./tools/WriteVersion.ps1
            $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
            & "$vs\MSBuild\Current\Bin\MSBuild.exe" xlOil.sln /m /p:Configuration=Release /p:Platform=x64 /v:m
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run:
          name: Package binaries and wheels
          command: |
            $pys = Get-ChildItem C:\Python3*\python.exe | ForEach-Object { "--python"; $_.FullName }
            & C:\Python312\python.exe tools/ci_package.py --version << pipeline.parameters.package-version >> @pys
      - persist_to_workspace:
          root: build
          paths: [dist]
      - store_artifacts:
          path: build/dist

  release:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - attach_workspace:
          at: build
      - run:
          name: Publish GitHub Release
          command: |
            curl -fsSL https://github.com/cli/cli/releases/download/v2.63.2/gh_2.63.2_linux_amd64.tar.gz | tar xz
            GH_TOKEN=$GITHUB_TOKEN ./gh_2.63.2_linux_amd64/bin/gh release create "$CIRCLE_TAG" build/dist/* \
              --repo "$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME" \
              --title "xlOil $CIRCLE_TAG (PyXLL-parity fork)" --notes-file CHANGELOG-fork.md

workflows:
  build:
    jobs:
      - python-tests:
          filters: { tags: { only: /^v.*/ } }
      - build-windows:
          requires: [python-tests]
          filters: { tags: { only: /^v.*/ } }
      - release:
          requires: [build-windows]
          filters:
            tags: { only: /^v.*/ }
            branches: { ignore: /.*/ }
