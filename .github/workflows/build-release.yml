name: Build and release

# Builds the xlOil add-in (Release x64), one Python wheel per supported Python
# version and the pure-Python xloil-stubs wheel, and runs the tests.
#
# Releasing: push a v* tag. The tag's run builds once and creates a *draft*
# GitHub Release with the files; test them, then publish the draft
# (gh release edit <tag> --draft=false). Nothing is built twice.

on:
  push:
    branches:
      - master
      - 'feature/**'
    tags:
      - 'v*'
    # Documentation-only changes don't need a build
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:
    inputs:
      force_compile:
        description: 'Compile the C++ even if it is unchanged (instead of reusing verified binaries)'
        type: boolean
        default: false

# A newer push to the same branch cancels the older run (never for tags)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  PACKAGE_VERSION: 0.22.1.post19

permissions:
  contents: read

jobs:
  python-tests:
    name: Python tests (stub mode, ${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.9', '3.12', '3.14']    # oldest, middle and newest Python the wheels are built for
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: libs/xlOil_Python/Package/setup.py
      - name: Install test dependencies
        run: python -m pip install numpy tomlkit pandas polars matplotlib pytest
      - name: Run tests
        working-directory: libs/xlOil_Python/Package
        env:
          XLOIL_STUBS: '1'
        run: python -m pytest tests -v
      - name: Installer parses in Windows PowerShell 5.1 (as iex (irm ...) runs it)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $text = Get-Content tools/install.ps1 -Raw
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseInput($text, [ref]$null, [ref]$errors)
          if ($errors) { $errors | ForEach-Object { Write-Host "$($_.Extent.StartLineNumber): $($_.Message)" }; exit 1 }
          Write-Host "install.ps1 parses"

  stubs-wheel:
    name: Build xloil-stubs wheel
    runs-on: ubuntu-latest
    needs: python-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install setuptools wheel
      - run: python tools/build_stubs_wheel.py --version ${{ env.PACKAGE_VERSION }}
      - name: Smoke test the stubs wheel
        run: |
          python -m venv /tmp/stubs
          /tmp/stubs/bin/pip install build/dist/xloil_stubs-*.whl
          cd /tmp && /tmp/stubs/bin/python -c "import xloil as xlo, xloil.testing as xt; f = xlo.func(lambda x: x + 1); print(xt.call(f, 1))"
      - uses: actions/upload-artifact@v4
        with:
          name: xloil-stubs-wheel
          path: build/dist/*.whl

  build-windows:
    name: Build add-in and wheels (Windows x64)
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # If the C++ is unchanged since the release in tools/native-binaries.json,
      # reuse that release's verified binaries instead of compiling: a fresh
      # unsigned build has a new file fingerprint, which Windows Defender's
      # machine-learning check can falsely flag. It's also ~15 minutes faster.
      - name: Reuse verified binaries if the C++ is unchanged
        id: native
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ('${{ inputs.force_compile }}' -eq 'true') { "reuse=false" >> $env:GITHUB_OUTPUT; "Compile forced"; exit 0 }
          $release = python tools/native_hash.py --check
          if ($LASTEXITCODE -eq 0) {
            gh release download $release --repo $env:GITHUB_REPOSITORY --pattern "*-x64-bin.zip" --dir build\reuse
            if ($LASTEXITCODE -ne 0) { Write-Error "Could not download binaries from $release"; exit 1 }
            Expand-Archive (Get-ChildItem build\reuse\*.zip | Select-Object -First 1).FullName -DestinationPath build\reuse
            "reuse=true" >> $env:GITHUB_OUTPUT
            Write-Host "C++ unchanged: reusing the verified binaries from $release"
          } else {
            "reuse=false" >> $env:GITHUB_OUTPUT
            Write-Host "C++ changed: compiling"
          }
          exit 0

      - name: Download sqlite amalgamation
        if: steps.native.outputs.reuse != 'true'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://www.sqlite.org/2022/sqlite-amalgamation-3390300.zip -OutFile external\sqlite.zip
          Expand-Archive external\sqlite.zip -DestinationPath external
          Rename-Item -Path (Get-ChildItem -Directory external\sqlite-amalgamation*) -NewName "sqlite"

      - name: Extract bundled Python headers and libs
        if: steps.native.outputs.reuse != 'true'
        shell: pwsh
        run: 7z x external\python.7z -oexternal -y

      # The COM code #imports the MSO, VBE, Excel and Add-in Designer type
      # libraries, which only come with Office. Only Excel is installed (MSO and
      # VBE come with it) to shorten the download. Microsoft's download is flaky
      # on CI runners, so retry.
      - name: Install Excel to get the Office type libraries
        if: steps.native.outputs.reuse != 'true'
        shell: pwsh
        timeout-minutes: 60
        run: |
          $params = "'/exclude:Access Groove Lync OneDrive OneNote Outlook PowerPoint Publisher Teams Word /updates:FALSE'"
          for ($i = 1; $i -le 3; $i++) {
            choco install office365business --no-progress -y --params $params
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "Office install attempt $i failed with $LASTEXITCODE, retrying in 60s"
            choco uninstall office365business -y --skip-autouninstaller 2>$null
            Start-Sleep -Seconds 60
          }
          exit 1

      - name: Set up MSBuild
        if: steps.native.outputs.reuse != 'true'
        uses: microsoft/setup-msbuild@v2

      - name: Write version file
        shell: pwsh
        run: ./tools/WriteVersion.ps1

      # Build only what ships (and the unit tests): skips the end-of-life
      # Python 3.7/3.8 extensions, TestAddin and the docs/packaging projects
      - name: Build add-in (Release x64)
        if: steps.native.outputs.reuse != 'true'
        shell: pwsh
        run: |
          $targets = @(
            'xlOil', 'xlOil-Loader', 'xlOil-XLL', 'UnitTests',
            'libs\xlOil_Python', 'libs\xlOil_SQL', 'libs\xlOil_Utils',
            'libs\xlOil_Python39', 'libs\xlOil_Python310', 'libs\xlOil_Python311',
            'libs\xlOil_Python312', 'libs\xlOil_Python313', 'libs\xlOil_Python314'
          ) -join ';'
          msbuild xlOil.sln /m "/t:$targets" /p:Configuration=Release /p:Platform=x64 /v:m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run C++ unit tests
        if: steps.native.outputs.reuse != 'true'
        shell: pwsh
        run: |
          $dll = Get-ChildItem build -Recurse -Filter UnitTests.dll | Select-Object -First 1
          if (-not $dll) { Write-Error "UnitTests.dll was not built"; exit 1 }
          $vstest = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -find "**\vstest.console.exe" | Select-Object -First 1
          & $vstest $dll.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/setup-python@v5
        id: py39
        with: { python-version: '3.9' }
      - uses: actions/setup-python@v5
        id: py310
        with: { python-version: '3.10' }
      - uses: actions/setup-python@v5
        id: py311
        with: { python-version: '3.11' }
      - uses: actions/setup-python@v5
        id: py312
        with: { python-version: '3.12' }
      - uses: actions/setup-python@v5
        id: py313
        with: { python-version: '3.13' }
      - uses: actions/setup-python@v5
        id: py314
        with: { python-version: '3.14' }

      - name: Package binaries and wheels
        shell: pwsh
        run: |
          $bin = if ('${{ steps.native.outputs.reuse }}' -eq 'true') { 'build\reuse\x64' } else { 'build\x64\Release' }
          python tools/ci_package.py --version $env:PACKAGE_VERSION --bin-dir $bin `
            --python "${{ steps.py39.outputs.python-path }}" `
            --python "${{ steps.py310.outputs.python-path }}" `
            --python "${{ steps.py311.outputs.python-path }}" `
            --python "${{ steps.py312.outputs.python-path }}" `
            --python "${{ steps.py313.outputs.python-path }}" `
            --python "${{ steps.py314.outputs.python-path }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke test a wheel imports outside Excel
        shell: pwsh
        run: |
          # Let pip pick the wheel matching the venv's Python from build\dist,
          # and check the runtime dependencies come with it
          & "${{ steps.py312.outputs.python-path }}" -m venv $env:RUNNER_TEMP\wheeltest
          & $env:RUNNER_TEMP\wheeltest\Scripts\pip.exe install --find-links build\dist "xloil==$env:PACKAGE_VERSION"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:RUNNER_TEMP\wheeltest\Scripts\xloil.exe --help
          & $env:RUNNER_TEMP\wheeltest\Scripts\python.exe -c "import win32com, numpy, tomlkit; import xloil.command_line as c; print('deps ok')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: xloil-windows-x64
          path: build/dist/*

  release:
    name: Create draft GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, stubs-wheel]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp tools/install.ps1 dist/
          ls -l dist
          # An existing release is left untouched
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists: not replacing its files"
            exit 0
          fi
          # Created as a draft: test the files, then publish it
          gh release create "${GITHUB_REF_NAME}" dist/* --draft \
            --title "xlOil ${GITHUB_REF_NAME} (Esmaeelpour fork)" \
            --notes-file CHANGELOG-fork.md
