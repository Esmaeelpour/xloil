name: Build and release

# Builds the xlOil add-in (Release x64), one Python wheel per supported Python
# version and the pure-Python xloil-stubs wheel, runs the tests, and on a
# version tag (v*) publishes everything as a GitHub Release.
#
# CircleCI (.circleci/config.yml) runs the same build as a fallback.

on:
  push:
    branches:
      - master
      - 'feature/**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

env:
  PACKAGE_VERSION: 0.22.1.post1

permissions:
  contents: read

jobs:
  python-tests:
    name: Python tests (stub mode, ${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install numpy tomlkit pandas polars matplotlib pytest
      - name: Run tests
        working-directory: libs/xlOil_Python/Package
        env:
          XLOIL_STUBS: '1'
        run: python -m pytest tests -v

  stubs-wheel:
    name: Build xloil-stubs wheel
    runs-on: ubuntu-latest
    needs: python-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install setuptools wheel
      - run: python tools/build_stubs_wheel.py --version ${{ env.PACKAGE_VERSION }}
      - name: Smoke test the stubs wheel
        run: |
          python -m venv /tmp/stubs
          /tmp/stubs/bin/pip install build/dist/xloil_stubs-*.whl
          cd /tmp && /tmp/stubs/bin/python -c "import xloil as xlo, xloil.testing as xt; f = xlo.func(lambda x: x + 1); print(xt.call(f, 1))"
      - uses: actions/upload-artifact@v4
        with:
          name: xloil-stubs-wheel
          path: build/dist/*.whl

  build-windows:
    name: Build add-in and wheels (Windows x64)
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download sqlite amalgamation
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://www.sqlite.org/2022/sqlite-amalgamation-3390300.zip -OutFile external\sqlite.zip
          Expand-Archive external\sqlite.zip -DestinationPath external
          Rename-Item -Path (Get-ChildItem -Directory external\sqlite-amalgamation*) -NewName "sqlite"

      - name: Extract bundled Python headers and libs
        shell: pwsh
        run: 7z x external\python.7z -oexternal -y

      # The COM code #imports the Office and Excel type libraries
      - name: Install Office to get the Excel type libraries
        shell: pwsh
        run: choco install office365business --no-progress -y

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Write version file
        shell: pwsh
        run: ./tools/WriteVersion.ps1

      - name: Build solution (Release x64)
        shell: pwsh
        run: msbuild xlOil.sln /m /p:Configuration=Release /p:Platform=x64 /v:m

      - name: Run C++ unit tests
        shell: pwsh
        continue-on-error: true
        run: |
          $dll = Get-ChildItem build -Recurse -Filter UnitTests.dll | Select-Object -First 1
          if ($dll) {
            $vstest = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -find "**\vstest.console.exe" | Select-Object -First 1
            & $vstest $dll.FullName
          } else { Write-Host "UnitTests.dll not built in Release configuration" }

      - uses: actions/setup-python@v5
        id: py39
        with: { python-version: '3.9' }
      - uses: actions/setup-python@v5
        id: py310
        with: { python-version: '3.10' }
      - uses: actions/setup-python@v5
        id: py311
        with: { python-version: '3.11' }
      - uses: actions/setup-python@v5
        id: py312
        with: { python-version: '3.12' }
      - uses: actions/setup-python@v5
        id: py313
        with: { python-version: '3.13' }

      - name: Package binaries and wheels
        shell: pwsh
        run: |
          python tools/ci_package.py --version $env:PACKAGE_VERSION `
            --python "${{ steps.py39.outputs.python-path }}" `
            --python "${{ steps.py310.outputs.python-path }}" `
            --python "${{ steps.py311.outputs.python-path }}" `
            --python "${{ steps.py312.outputs.python-path }}" `
            --python "${{ steps.py313.outputs.python-path }}"

      - name: Smoke test a wheel imports outside Excel
        shell: pwsh
        run: |
          python -m venv $env:RUNNER_TEMP\wheeltest
          $whl = Get-ChildItem build\dist\xloil-*-cp313-*.whl | Select-Object -First 1
          & $env:RUNNER_TEMP\wheeltest\Scripts\pip.exe install $whl.FullName
          & $env:RUNNER_TEMP\wheeltest\Scripts\xloil.exe --help

      - uses: actions/upload-artifact@v4
        with:
          name: xloil-windows-x64
          path: build/dist/*

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, stubs-wheel]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "xlOil ${GITHUB_REF_NAME} (PyXLL-parity fork)" \
            --notes-file CHANGELOG-fork.md
